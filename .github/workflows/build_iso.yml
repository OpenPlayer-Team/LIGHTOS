name: Build ISO

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build container image
        run: |
          docker system prune -af 2>/dev/null || true
          docker build --no-cache -t lightos:iso-build .
        env:
          DOCKER_BUILDKIT: 1

      - name: Create output directory
        run: mkdir -p output

      - name: Initialize podman storage
        run: |
          sudo rm -rf /var/lib/containers/storage
          sudo mkdir -p /var/lib/containers/storage
          sudo mkdir -p /etc/containers
          echo -e "[storage]\ndriver = \"overlay\"\nrunroot = \"/run/containers/storage\"\ngraphroot = \"/var/lib/containers/storage\"" | sudo tee /etc/containers/storage.conf

      - name: Load image into podman
        run: docker save lightos:iso-build | sudo podman load

      - name: Build ISO
        run: |
          sudo podman run --rm \
            --privileged \
            --pull=newer \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v ${{ github.workspace }}/disk_config:/disk_config \
            -v ${{ github.workspace }}/output:/output \
            quay.io/centos-bootc/bootc-image-builder:latest \
            --type iso \
            --rootfs xfs \
            --output /output \
            --log-level debug \
            lightos:iso-build

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightos-iso
          path: output/*.iso
          retention-days: 7